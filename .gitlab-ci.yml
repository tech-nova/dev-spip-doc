# CI docs avec MkDocs Material et Mike (versioning).
#
# Structure: un mkdocs-LANG-X.Y.yml par couple langue/version.
#
# Activation recommandee:
# 1) Remplacer `when: never` par des regles de branche/MR.
# 2) Configurer GitLab Pages sur l'instance.
# 3) Verifier `site_url` dans les fichiers mkdocs-*.yml.

stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "docs-pip-cache"
  paths:
    - .cache/pip

# ==============================================================================
# Tests et validation
# ==============================================================================

lint:
  stage: test
  image: python:3.12
  rules:
    - when: never # Activer: if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - make install
    - make lint

build:
  stage: test
  image: python:3.12
  rules:
    - when: never # Activer: if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - make install
    - make build

# ==============================================================================
# Deploiement avec Mike (versioning)
# ==============================================================================

# Production GitLab Pages (sans push git distant : Mike écrit la branche locale gh-pages,
# puis pages-artifact extrait vers public/). 
pages:
  stage: deploy
  image: python:3.12
  rules:
    - when: never # Activer: if: $CI_COMMIT_BRANCH == "main"
  script:
    - make install
    - git config user.name "CI Bot"
    - git config user.email "ci@spip.net"
    - make pages-artifact
  artifacts:
    paths:
      - public
  environment:
    name: documentation
    url: https://docs.spip.net/fr/latest/

# Deploiement manuel (interface web GitLab)
deploy-manual:
  stage: deploy
  image: python:3.12
  rules:
    - when: never # Activer: if: $CI_PIPELINE_SOURCE == "web" / when: manual
  variables:
    DEPLOY_VERSION: "5.0"
    DEPLOY_ALIAS: "dev"
    DEPLOY_LANG: "fr"
  script:
    - make install
    - git config user.name "CI Bot"
    - git config user.email "ci@spip.net"
    - git fetch origin gh-pages:gh-pages || true
    - make deploy-manual DEPLOY_LANG=$DEPLOY_LANG DEPLOY_VERSION=$DEPLOY_VERSION DEPLOY_ALIAS=$DEPLOY_ALIAS
