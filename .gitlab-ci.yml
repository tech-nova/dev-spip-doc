# CI documentation : Zensical (TOML) + GitLab Pages
#
# Configurations : zensical-fr-4.4.toml, zensical-fr-5.0.toml, zensical-en-4.4.toml, zensical-en-5.0.toml
#
# Activation recommandee:
# 1) Remplacer `when: never` par des regles de branche/MR.
# 2) Configurer GitLab Pages sur l'instance.
# 3) Verifier `site_url` et la navigation dans les fichiers zensical-*.toml

stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "docs-pip-cache"
  paths:
    - .cache/pip

# ==============================================================================
# Tests et validation
# ==============================================================================

lint:
  stage: test
  image: python:3.12
  rules:
    - when: never # Activer: if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - make install
    - make lint

build:
  stage: test
  image: python:3.12
  rules:
    - when: never # Activer: if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - make install
    - make build

# ==============================================================================
# Deploiement GitLab Pages (artefact public/ sans branche gh-pages)
# ==============================================================================

pages:
  stage: deploy
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - make install
    - make pages-artifact
  artifacts:
    paths:
      - public
  environment:
    name: documentation
    url: https://doc.spip.net/fr/latest/

# Build complet manuel (interface web GitLab) — meme artefact que pages
deploy-manual:
  stage: deploy
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"  
    - when: manual
  script:
    - make install
    - make pages-artifact
  artifacts:
    paths:
      - public
