# SPIP 5.0 — technical documentation (English)

[project]
site_name = "SPIP 5.0 - Technical Documentation"
site_description = "Technical documentation for SPIP 5.0"
site_url = "https://doc.spip.net/en/5.0/"
repo_url = "https://git.spip.net/spip/docs"
repo_name = "spip/docs"
edit_uri = "-/edit/main/docs/en/5.0/"
docs_dir = "docs/en/5.0"
site_dir = "public/en/5.0"

nav = [
  { "Home" = "index.md" },
  { "Guides" = "guides/index.md" },
  { "Features" = "features/index.md" },
  { "Reference" = "reference/index.md" },
]

[project.extra]
alternate = [
  { name = "Français", link = "/fr/5.0/", lang = "fr" },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

[project.theme]
name = "material"
variant = "classic"
custom_dir = "overrides"
language = "en"
font = false
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

# Mermaid : https://zensical.org/docs/authoring/diagrams/
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[[project.markdown_extensions.pymdownx.highlight.extend_pygments_lang]]
name = "php"
lang = "php"
options = { startinline = true }
