# SPIP 5.0 — documentation technique (français)

[project]
site_name = "SPIP 5.0 - Documentation technique"
site_description = "Documentation technique de SPIP 5.0"
site_url = "https://doc.spip.net/fr/5.0/"
repo_url = "https://git.spip.net/spip/docs"
repo_name = "spip/docs"
edit_uri = "-/edit/main/docs/fr/5.0/"
docs_dir = "docs/fr/5.0"
site_dir = "public/fr/5.0"

nav = [
  { "Accueil" = "index.md" },
  { "Migration" = [
    { "Sommaire migration" = "upgrade/index.md" },
    { "Prérequis" = "upgrade/prerequis.md" },
    { "Environnement et kernel" = "upgrade/environnement-kernel.md" },
    { "Squelettes et syntaxe" = "upgrade/squelettes.md" },
    { "API PHP et fonctions" = "upgrade/php-api.md" },
    { "Migrer les pipelines" = "upgrade/pipelines.md" },
    { "Migrer les pipelines d’un plugin" = "upgrade/pipelines-plugins.md" },
    { "Javascript et assets" = "upgrade/javascript.md" },
    { "Espace privé et menus" = "upgrade/espace-prive-et-menus.md" },
    { "Dépréciations et suppressions" = "upgrade/deprecations-et-suppressions.md" },
  ]},
  { "Fonctionnalités" = [
    { "Sommaire features" = "features/index.md" },
    { "Event dispatcher et pipelines" = "features/event-dispatcher-et-pipelines.md" },
    { "Cron et attributs" = "features/cron-taches-attributs.md" },
    { "Menus" = "features/menus.md" },
    { "Services Symfony" = "features/services-symfony.md" },
    { "HTTP request response" = "features/http-request-response.md" },
    { "Logger" = "features/logger.md" },
  ]},
  { "Référence" = [
    { "Sommaire réference" = "reference/index.md" },
    { "Paramètres SPIP" = "reference/parametres-spip.md" },
    { "SPIP version et symboles" = "reference/spipversion-et-symboles.md" },
    { "Événements de pipelines" = "reference/evenements-pipelines.md" },
    { "Attribut AsPipelineListener" = "reference/as-pipeline-listener.md" },
  ]},
]

[project.extra]
alternate = [
  { name = "English", link = "/en/5.0/", lang = "en" },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

[project.theme]
name = "material"
variant = "classic"
custom_dir = "overrides"
language = "fr"
font = false
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
]

# Préférence système + clair + sombre — https://zensical.org/docs/setup/colors/
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Basculer en mode clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Basculer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Utiliser le thème du système"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[[project.markdown_extensions.pymdownx.highlight.extend_pygments_lang]]
name = "php-inline"
lang = "php"
options = { startinline = true }
