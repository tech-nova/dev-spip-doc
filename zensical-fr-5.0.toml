# SPIP 5.0 — documentation technique (français)

[project]
site_name = "SPIP 5.0 - Documentation technique"
site_description = "Documentation technique de SPIP 5.0"
site_url = "https://doc.spip.net/fr/5.0/"
repo_url = "https://git.spip.net/spip/docs"
repo_name = "spip/docs"
edit_uri = "-/edit/main/docs/fr/5.0/"
docs_dir = "docs/fr/5.0"
site_dir = "public/fr/5.0"

nav = [
  { "Accueil" = "index.md" },
  { "Architecture" = [
    { "Sommaire architecture" = "architecture/index.md" },
    { "Dépôts spip-league" = "architecture/depots-spip-league.md" },
    { "Cycle applicatif HTTP" = "architecture/cycle-applicatif-http.md" },
    { "Feuille de route" = "architecture/feuille-de-route.md" },
  ]},
  { "Fonctionnalités" = [
    { "Sommaire features" = "features/index.md" },
    { "Communication" = [
      { "Event dispatcher" = "features/event-dispatcher-et-pipelines.md" },
    ]},
    { "Services et configuration" = [
      { "Services Symfony" = "features/services-symfony.md" },
      { "Façade Spip" = "features/acces-services-spip.md" },
      { "Configuration" = "features/config.md" },
    ]},
    { "Interface et sécurité" = [
      { "Menus" = "features/menus.md" },
      { "HTTP" = "features/http-request-response.md" },
      { "Guard" = "features/guard.md" },
    ]},
    { "Exécution" = [
      { "Cron" = "features/cron-taches-attributs.md" },
      { "Logger" = "features/logger.md" },
    ]},
  ]},
  { "Référence" = [
    { "Sommaire réference" = "reference/index.md" },
    { "Paramètres SPIP" = "reference/parametres-spip.md" },
    { "SPIP version et symboles" = "reference/spipversion-et-symboles.md" },
    { "Événements pipelines" = "reference/evenements-pipelines.md" },
    { "AsPipelineListener" = "reference/as-pipeline-listener.md" },
  ]},
  { "Migration" = [
    { "Sommaire migration" = "upgrade/index.md" },
    { "Préparation" = [
      { "Prérequis" = "upgrade/prerequis.md" },
      { "Environnement et kernel" = "upgrade/environnement-kernel.md" },
    ]},
    { "Cœur et squelettes" = [
      { "Squelettes et syntaxe" = "upgrade/squelettes.md" },
      { "API PHP et fonctions" = "upgrade/php-api.md" },
      { "Configuration et métas" = "upgrade/config.md" },
      { "Compilateur de squelettes" = "upgrade/compilateur.md" },
    ]},
    { "Plugins modernes" = [
      { "Pipelines" = "upgrade/pipelines.md" },
      { "Pipelines (plugin)" = "upgrade/pipelines-plugins.md" },
      { "Tâches cron" = "upgrade/cron-taches-attributs.md" },
      { "Services plugin" = "upgrade/services-plugin.md" },
      { "Menus et onglets" = "upgrade/menus-onglets.md" },
      { "Façade Spip" = "upgrade/acces-services-spip.md" },
      { "HTTP Request/Response" = "upgrade/http-request-response.md" },
      { "Logs PSR-3" = "upgrade/logger.md" },
      { "Étendre Guard" = "upgrade/guard-extension.md" },
    ]},
    { "Interface et fin" = [
      { "Javascript et assets" = "upgrade/javascript.md" },
      { "Espace privé (ruptures)" = "upgrade/espace-prive-et-menus.md" },
      { "Dépréciations" = "upgrade/deprecations-et-suppressions.md" },
    ]},
  ]},
]

[project.extra]
alternate = [
  { name = "English", link = "/en/5.0/", lang = "en" },
]

[project.extra.version]
provider = "mike"
default = "latest"
alias = true

[project.theme]
name = "material"
variant = "classic"
custom_dir = "overrides"
language = "fr"
font = false
features = [
  "navigation.tabs",
  #"navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
]

# Préférence système + clair + sombre — https://zensical.org/docs/setup/colors/
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Basculer en mode clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Basculer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Utiliser le thème du système"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

# Mermaid : https://zensical.org/docs/authoring/diagrams/
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[[project.markdown_extensions.pymdownx.highlight.extend_pygments_lang]]
name = "php"
lang = "php"
options = { startinline = true }
