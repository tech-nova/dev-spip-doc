repo_url: https://git.spip.net/spip/docs
repo_name: spip/docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  font:
    text: Montserrat
    code: Roboto Mono

extra_css:
  - assets/stylesheets/spip-theme.css

extra_javascript:
  - assets/javascripts/spip-nav.js

extra:
  version:
    provider: mike
    default: latest
    alias: true

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      extend_pygments_lang:
        - name: php-inline
          lang: php
          options:
            startinline: true

plugins:
  - search
